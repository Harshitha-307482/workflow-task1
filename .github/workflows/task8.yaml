name: 08-Multi-Job

on:
  push:
    paths:
      - '.github/workflows/task8.yaml'   # only triggers when files in task8/ folder change


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest