on:
  push:
    paths:
      - '.github/workflows/task11.yaml'

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [16,18,20]

    steps:
      - uses: actions/checkout@v4
      - name: setup-node
        uses: actions/stetup-node@v4
        with: 
          node-version: ${{matrix.node}}
      - run: npm install
      - run: npm test