on: 
  push:
    paths:
      - '.github/workflows/task12.yaml'
      - 'package-lock.json'
      - 'package.json'

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}
      
    - name: install dependencies 
      run: npm ci
